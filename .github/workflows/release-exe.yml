name: Publish Standard EXE

on:
  create:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize-draft:
    if: >-
      github.repository == 'OneThingChanged/Acedia' &&
      github.event_name == 'create' && github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'finalize/exe/')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify the completed build and publish its uploaded draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-GithubJson {
            param([string]$Endpoint)
            $output = & gh api $Endpoint
            if ($LASTEXITCODE -ne 0) { throw "GitHub lookup failed: $Endpoint" }
            return ($output -join "`n") | ConvertFrom-Json
          }
          if ($env:GITHUB_REF_NAME -notmatch '^finalize/exe/(\d+\.\d+\.\d+\.\d+)/(\d+)$') { throw 'Invalid finalization branch.' }
          $version = $Matches[1]
          $buildRunId = $Matches[2]
          $repository = 'OneThingChanged/Acedia'
          $sourceCommit = (Read-GithubJson "repos/$repository/git/ref/heads/release/exe/$version").object.sha
          $run = Read-GithubJson "repos/$repository/actions/runs/$buildRunId"
          if ($run.status -ne 'completed' -or $run.event -ne 'create' -or
              $run.path -ne '.github/workflows/release-exe.yml' -or
              (-not $run.head_branch.StartsWith("rebuild/exe/$version/") -and $run.head_branch -ne "release/exe/$version")) {
            throw 'The producer is not a completed official release build.'
          }
          $jobs = (Read-GithubJson "repos/$repository/actions/runs/$buildRunId/jobs").jobs
          $producer = @($jobs | Where-Object name -eq 'release')
          if ($producer.Count -ne 1) { throw 'Expected one release build job.' }
          foreach ($name in @('Source and creation dialog checks', 'Build EXE with publication disabled', 'Packaged checks')) {
            $step = @($producer[0].steps | Where-Object name -eq $name)
            if ($step.Count -ne 1 -or $step[0].conclusion -ne 'success') { throw "Required build check did not pass: $name" }
          }
          $buildLog = & gh run view $buildRunId --repo $repository --log
          if ($LASTEXITCODE -ne 0) { throw 'Producer log lookup failed.' }
          $buildLog = $buildLog -join "`n"
          if (-not $buildLog.Contains("Product source: $sourceCommit / $version")) { throw 'Build source attestation differs from the product source.' }
          $installerName = "Acedia-Setup-$version-x64.exe"
          $expectedNames = @($installerName, "$installerName.blockmap", 'latest-exe.json')
          $drafts = @(Read-GithubJson "repos/$repository/releases?per_page=100" | Where-Object tag_name -eq "v$version")
          if ($drafts.Count -ne 1 -or -not $drafts[0].draft -or $drafts[0].prerelease -or
              $drafts[0].target_commitish -ne $sourceCommit -or $drafts[0].assets.Count -ne 3) { throw 'Expected one exact-source draft with three assets.' }
          $draft = $drafts[0]
          $assetRoot = Join-Path $env:RUNNER_TEMP "verified-exe-$version"
          New-Item -ItemType Directory -Path $assetRoot | Out-Null
          & gh release download "v$version" --repo $repository --dir $assetRoot
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset download failed.' }
          foreach ($name in $expectedNames) {
            $asset = @($draft.assets | Where-Object name -eq $name)
            $local = Get-Item -LiteralPath (Join-Path $assetRoot $name)
            $hash = (Get-FileHash -LiteralPath $local.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $local.Length -le 0 -or $local.Length -ne $asset[0].size -or
                $asset[0].digest -ne "sha256:$hash") { throw "Draft asset digest differs: $name" }
          }
          $installer = Get-Item -LiteralPath (Join-Path $assetRoot $installerName)
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content -LiteralPath (Join-Path $assetRoot 'latest-exe.json') -Raw | ConvertFrom-Json
          if ($installer.VersionInfo.FileVersion -ne $version -or $manifest.schemaVersion -ne 1 -or
              $manifest.channel -ne 'exe' -or $manifest.version -ne $version -or $manifest.fileName -ne $installerName -or
              $manifest.size -ne $installer.Length -or $manifest.sha256 -ne $installerHash -or
              $manifest.bundledMobileVersion -notmatch '^\d+\.\d+\.\d+\.\d+$' -or
              -not $buildLog.Contains("SHA-256 $installerHash, Authenticode")) { throw 'Draft installer differs from the verified build or manifest.' }
          $tagRef = Read-GithubJson "repos/$repository/git/ref/tags/v$version"
          if ($tagRef.object.type -ne 'commit' -or $tagRef.object.sha -ne $sourceCommit) { throw 'Release tag differs from the verified source.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          Write-Output "Verified uploaded $installerName ($($installer.Length) bytes, SHA-256 $installerHash, Authenticode $($signature.Status))."
          $result = & gh api --method PATCH "repos/$repository/releases/$($draft.id)" -F draft=false -F prerelease=false -f make_latest=true
          if ($LASTEXITCODE -ne 0) { throw 'Draft publication failed.' }
          $published = Read-GithubJson "repos/$repository/releases/$($draft.id)"
          $latest = Read-GithubJson "repos/$repository/releases/latest"
          if ($published.draft -or $published.prerelease -or -not $published.published_at -or
              $published.target_commitish -ne $sourceCommit -or $latest.id -ne $published.id) { throw 'Latest stable publication was not confirmed.' }
          Write-Output "Published $($published.html_url) from $sourceCommit; installer execution was not required."
  prepare-tag:
    if: >-
      github.repository == 'OneThingChanged/Acedia' &&
      github.event_name == 'create' && github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'prepare-tag/exe/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare the fixed product tag without publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -notmatch '^prepare-tag/exe/(\d+\.\d+\.\d+\.\d+)$') { throw 'Invalid tag preparation branch.' }
          $version = $Matches[1]
          $sourceCommit = & gh api "repos/OneThingChanged/Acedia/git/ref/heads/release/exe/$version" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Fixed product source is missing.' }
          $encoded = & gh api "repos/OneThingChanged/Acedia/contents/app/package.json?ref=$sourceCommit" --jq '.content'
          if ($LASTEXITCODE -ne 0) { throw 'Product version lookup failed.' }
          $package = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($encoded -join "`n"))) | ConvertFrom-Json
          if ($package.multiAgentReleaseVersion -ne $version) { throw 'Product version differs from the tag.' }
          $tagJson = & gh api "repos/OneThingChanged/Acedia/git/ref/tags/v$version" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $tagJson = & gh api --method POST 'repos/OneThingChanged/Acedia/git/refs' -f "ref=refs/tags/v$version" -f "sha=$sourceCommit"
            if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed.' }
          }
          $tagRef = ($tagJson -join "`n") | ConvertFrom-Json
          if ($tagRef.object.type -ne 'commit' -or $tagRef.object.sha -ne $sourceCommit) { throw 'Product tag differs from the fixed source.' }
          Write-Output "Prepared v$version from $sourceCommit; no release was published."
  release:
    if: >-
      github.repository == 'OneThingChanged/Acedia' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.ref_type == 'branch' &&
        (startsWith(github.event.ref, 'release/exe/') || startsWith(github.event.ref, 'rebuild/exe/'))))
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - name: Resolve fixed product source
        id: source
        working-directory: .
        run: |
          if ($env:GITHUB_REF_NAME -match '^rebuild/exe/(\d+\.\d+\.\d+\.\d+)/[^/]+$') {
            $sourceRef = "release/exe/$($Matches[1])"
          } else {
            $sourceRef = $env:GITHUB_SHA
          }
          "ref=$sourceRef" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm source version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).multiAgentReleaseVersion
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid product version.' }
          if ($env:GITHUB_REF_NAME.StartsWith('release/exe/') -and
              $env:GITHUB_REF_NAME -ne "release/exe/$version") { throw 'Release branch and source version differ.' }
          if ($env:GITHUB_REF_NAME.StartsWith('rebuild/exe/') -and
              $env:GITHUB_REF_NAME.Split('/')[2] -ne $version) { throw 'Rebuild branch and source version differ.' }
          $sourceCommit = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Product source commit is missing.' }
          "RELEASE_SOURCE_COMMIT=$sourceCommit" >> $env:GITHUB_ENV
          Write-Output "Product source: $sourceCommit / $version"
      - name: Prepare the existing signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE '.build-tools'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $zip = Join-Path $root 'android-build-tools.zip'
          Invoke-WebRequest 'https://dl.google.com/android/repository/build-tools_r35_windows.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA1).Hash.ToLowerInvariant() -ne 'af059bb67cf7786f45ee0db85e2d24985df1b4b6') {
            throw 'Android build tools checksum mismatch.'
          }
          $sdk = Join-Path $root 'android-sdk'
          $tools = Join-Path $sdk 'build-tools/35.0.0'
          Expand-Archive -LiteralPath $zip -DestinationPath $tools
          $extracted = (Get-ChildItem -LiteralPath $tools -Directory | Select-Object -First 1).FullName
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
          # The archive has an android-15 wrapper directory.
          $sdkBuildTools = Join-Path $sdk 'build-tools'
          $verifiedTools = Join-Path $sdkBuildTools '35.0.0-verified'
          if (-not $extracted.StartsWith([IO.Path]::GetFullPath($root) + [IO.Path]::DirectorySeparatorChar)) {
            throw 'Unsafe Android tools path.'
          }
          Move-Item -LiteralPath $extracted -Destination $verifiedTools
          $manifestPath = Join-Path $root 'previous-exe.json'
          Invoke-WebRequest 'https://github.com/OneThingChanged/Acedia/releases/latest/download/latest-exe.json' -OutFile $manifestPath
          $mobileVersion = (Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json).bundledMobileVersion
          if ($mobileVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid bundled APK version.' }
          $releaseJson = & gh api "repos/OneThingChanged/Acedia/releases/tags/v$mobileVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Previous APK release lookup failed.' }
          $release = ($releaseJson -join "`n") | ConvertFrom-Json
          $asset = @($release.assets | Where-Object name -eq "Acedia-Mobile-$mobileVersion.apk")
          if ($release.draft -or $release.prerelease -or $asset.Count -ne 1 -or
              $asset[0].digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Verified public APK asset is missing.' }
          $apk = Join-Path $root 'Acedia-Mobile.apk'
          Invoke-WebRequest $asset[0].browser_download_url -OutFile $apk
          if ((Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset[0].digest.Substring(7) -or
              (Get-Item $apk).Length -ne $asset[0].size) { throw 'Public APK checksum mismatch.' }
          "MULTIAGENT_MOBILE_APK_PATH=$apk" >> $env:GITHUB_ENV
          "MULTIAGENT_ANDROID_CERT_SHA256=6d85fd669451bfb44289dbb1b5e1648f33367bdff0d983a9d04b76355d6f7573" >> $env:GITHUB_ENV
      - run: npm ci --no-audit --no-fund
      - name: Source and creation dialog checks
        run: |
          npm test -- --exclude electron/services/electron-services.test.mjs --exclude electron/usage-collector/distribution.test.mjs --testTimeout=60000 --maxWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Windows installer/watcher suite also needs an idle runner for its polling deadline.
          npm test -- electron/usage-collector/distribution.test.mjs --testTimeout=60000 --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # This suite launches Windows PowerShell and has its own 15-second test deadline.
          npm test -- electron/services/electron-services.test.mjs --testTimeout=60000 --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run electron:new-session-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run electron:organization-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run electron:session-usage-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run electron:terminal-links-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run electron:smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build EXE with publication disabled
        run: |
          # Configure the installed CLI; keep the fixed product source unchanged.
          $builderShim = Join-Path (Get-Location) 'node_modules/.bin/electron-builder.cmd'
          $builderCommand = Get-Content -LiteralPath $builderShim -Raw
          if (-not $builderCommand.Contains('%*')) { throw 'Unexpected electron-builder CLI wrapper.' }
          $builderCommand = $builderCommand.Replace('%*', '%* --publish never')
          Set-Content -LiteralPath $builderShim -Value $builderCommand -Encoding ascii
          npm run release:build:github -- --desktop-only
      - name: Packaged checks
        run: |
          npm run electron:packaged-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run electron:packaged-lifecycle-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/publish-github-exe.ps1 -VerifyOnly
      - name: Upload, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Draft releases do not create a backing tag. Prepare it before the publisher verifies it.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).multiAgentReleaseVersion
          $tagJson = & gh api "repos/OneThingChanged/Acedia/git/ref/tags/v$version" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $tagJson = & gh api --method POST 'repos/OneThingChanged/Acedia/git/refs' -f "ref=refs/tags/v$version" -f "sha=$env:RELEASE_SOURCE_COMMIT"
            if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed.' }
          }
          $tagRef = ($tagJson -join "`n") | ConvertFrom-Json
          if ($tagRef.object.type -ne 'commit' -or $tagRef.object.sha -ne $env:RELEASE_SOURCE_COMMIT) { throw 'Tag differs from the build source.' }
          ./scripts/publish-github-exe.ps1 -SourceCommit $env:RELEASE_SOURCE_COMMIT
