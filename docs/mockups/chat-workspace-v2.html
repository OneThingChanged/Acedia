<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Acedia · 대화 UX 초안 02</title>
  <style>
    :root {
      --bg:#191b1f; --sidebar:#121418; --surface:#22252a; --raised:#2a2e35;
      --user:#2b3038; --hover:#262a30; --line:#31363e; --text:#e9edf3;
      --muted:#a2aab7; --quiet:#77818f; --accent:#7cb0ff; --selected:#203045;
      --green:#83ccaa; --amber:#e9bf80; --blue:#88b6f3; --primary:#e6eaf0;
      --primary-text:#20252d; --overlay:#05070baa; --shadow:0 20px 90px #0007;
      --sidebar-width:260px; --column:760px; color-scheme:dark;
    }
    :root[data-theme="light"] {
      --bg:#fff; --sidebar:#f5f6f8; --surface:#f5f6f8; --raised:#e9ecf1;
      --user:#edf0f5; --hover:#e9edf3; --line:#e0e4ea; --text:#222832;
      --muted:#646e7d; --quiet:#7f8895; --accent:#326cc5; --selected:#e3edf9;
      --green:#31815d; --amber:#986518; --blue:#3974bd; --primary:#29384c;
      --primary-text:#fff; --overlay:#26314555; --shadow:0 20px 90px #26314525;
      color-scheme:light;
    }
    * { box-sizing:border-box; }
    body { margin:0; height:100dvh; overflow:hidden; color:var(--text); background:var(--bg); font:14px/1.65 "Segoe UI","Malgun Gothic",sans-serif; }
    button,input,textarea,select { font:inherit; color:inherit; }
    button { border:0; background:none; cursor:pointer; }
    button:disabled { opacity:.4; cursor:default; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    [hidden] { display:none !important; }
    h1,h2,h3,p { margin:0; }
    a { color:var(--accent); text-underline-offset:3px; }
    .sprites { position:absolute; width:0; height:0; overflow:hidden; }
    .icon { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .icon.small { width:15px; height:15px; }
    .icon-button { width:31px; height:31px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; border-radius:8px; color:var(--muted); }
    .icon-button:hover { color:var(--text); background:var(--hover); }
    .icon-button[aria-pressed="true"] { color:var(--accent); background:var(--selected); }
    .quiet { color:var(--quiet); }
    .muted { color:var(--muted); }
    .ellipsis { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .spacer { flex:1; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border:1px solid var(--line); border-radius:6px; color:var(--muted); font-size:11px; white-space:nowrap; }
    kbd { padding:1px 5px; border:1px solid var(--line); border-radius:4px; font:10px/1.5 "Segoe UI",sans-serif; color:var(--quiet); }
    .chrome { position:relative; height:30px; padding:0 12px; display:flex; align-items:center; justify-content:flex-end; gap:6px; border-bottom:1px solid var(--line); background:var(--sidebar); }
    .chrome .icon-button { width:27px; height:25px; }
    .chrome .icon { width:14px; height:14px; }
    .top-quick-search { position:absolute; left:50%; transform:translateX(-50%); width:min(330px,36vw); height:23px; display:flex; align-items:center; gap:8px; padding:0 10px; border:1px solid var(--line); border-radius:6px; color:var(--muted); font-size:10px; background:var(--bg); }
    .top-quick-search:hover { border-color:var(--quiet); background:var(--surface); }
    .top-quick-search kbd { margin-left:auto; padding:0 4px; font-size:8px; }
    .window-controls { display:flex; gap:24px; padding:0 6px 0 22px; color:var(--quiet); font-size:12px; }
    .app { height:calc(100dvh - 52px); display:grid; grid-template-columns:var(--sidebar-width) minmax(0,1fr); transition:grid-template-columns .16s; }
    .sidebar { min-height:0; background:var(--sidebar); border-right:1px solid var(--line); display:flex; flex-direction:column; }
    .sidebar-head { display:flex; align-items:center; gap:4px; height:68px; padding:13px 12px 12px 17px; }
    .brand { display:flex; align-items:center; gap:8px; margin-right:auto; min-width:0; }
    .brand img { width:26px; height:26px; object-fit:contain; }
    .brand strong { font-size:18px; letter-spacing:-.5px; font-weight:650; }
    .sidebar-head .icon-button { width:28px; height:29px; }
    .notification-button { position:relative; }
    .notification-button::after { content:""; position:absolute; top:5px; right:5px; width:5px; height:5px; background:var(--amber); border:1px solid var(--sidebar); border-radius:50%; }
    .sidebar-actions { padding:0 12px 14px; }
    .new-chat { width:100%; display:flex; align-items:center; gap:10px; height:38px; padding:0 12px; margin-bottom:13px; border-radius:8px; color:var(--primary-text); background:var(--primary); font-size:12px; font-weight:650; }
    .new-chat:hover { filter:brightness(1.06); }
    .new-chat kbd { margin-left:auto; padding:0; border:0; color:inherit; opacity:.55; font-size:9px; }
    .sidebar-search { display:flex; align-items:center; gap:7px; height:35px; margin:0 0 10px; padding:0 9px; border:1px solid var(--line); border-radius:7px; color:var(--quiet); background:var(--bg); }
    .sidebar-search:focus-within { border-color:var(--accent); box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 15%,transparent); }
    .sidebar-search input { flex:1; min-width:0; width:100%; padding:0; border:0; outline:none; background:none; color:var(--text); font-size:11px; }
    .sidebar-search input::placeholder { color:var(--quiet); }
    .sidebar-search input:focus-visible { outline:none; }
    .sidebar-search .icon { width:15px; height:15px; }
    .sidebar-search .icon-button { width:21px; height:23px; border-radius:4px; }
    .sidebar-search-summary { padding:15px 9px 5px; color:var(--quiet); font-size:10px; }
    .sidebar-search-results .result-label { padding:12px 9px 5px; }
    .sidebar-search-results .search-result { gap:9px; padding:9px; }
    .sidebar-result-copy { flex:1; min-width:0; }
    .sidebar-result-copy strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; font-weight:500; }
    .sidebar-result-copy small { display:block; margin:2px 0 0; color:var(--quiet); font-size:10px; }
    .sidebar-search-results mark,.search-results mark { background:transparent; color:var(--accent); }
    .sidebar-search-empty { padding:24px 9px; color:var(--muted); font-size:11px; }
    .sidebar-search-empty strong { display:block; font-weight:500; color:var(--text); margin-bottom:5px; }
    .sidebar-search-help { padding:12px 9px; color:var(--quiet); font-size:9px; }
    .nav-row { width:100%; height:34px; display:flex; align-items:center; gap:11px; padding:0 11px; border-radius:7px; color:var(--muted); text-align:left; font-size:12px; }
    .nav-row:hover { background:var(--hover); }
    .nav-row[aria-current="page"] { background:var(--selected); color:var(--text); }
    .nav-row .count { margin-left:auto; padding:0 5px; font-size:10px; color:var(--quiet); background:var(--hover); border-radius:4px; }
    .sidebar-scroll { flex:1; min-height:0; overflow:auto; padding:0 12px 24px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
    .section { margin-top:13px; }
    .section-title { height:32px; display:flex; align-items:center; gap:6px; padding:0 9px; color:var(--quiet); font-size:11px; }
    .section-title .icon-button { width:23px; height:23px; }
    .section-title .icon { width:14px; height:14px; }
    .section-title button:first-child { text-align:left; padding:0; color:inherit; }
    .project { margin:2px 0; }
    .project-row { width:100%; display:flex; align-items:center; gap:9px; height:34px; padding:0 10px; border-radius:7px; font-size:12px; text-align:left; }
    .project-row:hover { background:var(--hover); }
    .project-row .icon { width:16px; height:16px; color:var(--muted); }
    .project-row .chevron { width:12px; transform:rotate(-90deg); }
    .project-row[aria-expanded="true"] .chevron { transform:none; }
    .project-row .count { margin-left:auto; color:var(--quiet); font-size:10px; }
    .project-children { border-left:1px solid var(--line); margin:3px 0 10px 18px; padding-left:7px; }
    .project-children .session { height:31px; min-height:31px; padding:0 8px; font-size:11px; }
    .session { display:flex; align-items:center; gap:9px; width:100%; min-height:43px; padding:8px 10px; margin:2px 0; text-align:left; border-radius:7px; font-size:12px; }
    .session:hover { background:var(--hover); }
    .session[aria-current="page"] { background:var(--selected); }
    .dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; background:var(--green); }
    .dot.sleeping { background:var(--blue); }
    .dot.waiting { background:var(--amber); }
    .dot.working { box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 15%,transparent); animation:pulse 1.7s infinite; }
    .session-copy { flex:1; min-width:0; }
    .session-copy small { display:block; font-size:10px; color:var(--quiet); }
    .filters { display:flex; gap:2px; margin:6px 0 12px; padding:3px; border-radius:7px; background:var(--bg); }
    .filters button { flex:1; font-size:10px; padding:4px 0; color:var(--quiet); border-radius:5px; }
    .filters button[aria-pressed="true"] { background:var(--raised); color:var(--text); }
    .group-label { color:var(--quiet); font-size:10px; padding:4px 10px; }
    .session .more { opacity:0; font-size:16px; color:var(--quiet); }
    .session:hover .more,.session:focus-visible .more { opacity:1; }
    .collapsed { --sidebar-width:64px; }
    .collapsed .sidebar-head { justify-content:center; padding:14px 0; }
    .collapsed .sidebar-head .brand,.collapsed .sidebar-head .notification-button,.collapsed .sidebar-scroll,.collapsed .hide-collapsed { display:none; }
    .collapsed .sidebar-actions { padding:0 10px; }
    .collapsed .new-chat,.collapsed .nav-row { justify-content:center; padding:0; height:40px; margin-bottom:8px; }
    .workspace { min-width:0; min-height:0; display:flex; flex-direction:column; position:relative; }
    .workspace-head { height:68px; flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 24px; border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent); }
    .chat-heading { flex:1; min-width:0; }
    .breadcrumb { display:flex; align-items:center; gap:6px; font-size:10px; color:var(--quiet); margin-bottom:2px; }
    .breadcrumb .icon { width:12px; height:12px; }
    h1 { font-size:14px; font-weight:600; letter-spacing:-.15px; }
    .draft-label { font-size:10px; padding:2px 7px; border:1px solid var(--line); border-radius:5px; color:var(--quiet); }
    .draft-label:hover { color:var(--text); background:var(--hover); }
    .view-switch { display:flex; padding:3px; border:1px solid var(--line); border-radius:8px; gap:2px; }
    .view-switch button { height:27px; font-size:11px; padding:0 9px; color:var(--quiet); border-radius:5px; display:flex; align-items:center; gap:6px; }
    .view-switch button[aria-pressed="true"] { color:var(--text); background:var(--raised); }
    .view-switch .icon { width:14px; height:14px; }
    .workarea { display:flex; flex:1; min-height:0; min-width:0; }
    .conversation { display:flex; flex:1; flex-direction:column; min-height:0; min-width:0; position:relative; }
    .chat-scroll { flex:1; min-height:0; overflow:auto; padding:26px 34px 25px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; scroll-behavior:smooth; }
    .thread { max-width:var(--column); margin:0 auto; display:flex; flex-direction:column; gap:29px; }
    .day-marker { color:var(--quiet); font-size:10px; text-align:center; margin:0 0 -5px; }
    .turn { min-width:0; width:100%; }
    .turn.user { display:flex; flex-direction:column; align-items:flex-end; }
    .user-bubble { width:fit-content; max-width:78%; margin-left:auto; background:var(--user); padding:13px 18px; border-radius:19px 19px 5px 19px; font-size:14px; line-height:1.8; word-break:keep-all; overflow-wrap:anywhere; }
    .user-text { white-space:pre-wrap; }
    .user-meta { color:var(--quiet); font-size:10px; display:flex; align-items:center; gap:5px; height:26px; margin-top:3px; }
    .user-meta .icon-button { width:25px; height:25px; }
    .message-actions { display:flex; align-items:center; gap:3px; color:var(--quiet); }
    .message-actions .icon-button { width:27px; height:27px; }
    .message-actions .icon { width:15px; height:15px; }
    .user-meta .message-actions { opacity:0; }
    .turn.user:hover .message-actions,.turn.user:focus-within .message-actions { opacity:1; }
    .attachment-images { display:flex; flex-wrap:wrap; gap:8px; margin:9px 0 0; max-width:100%; }
    .attachment-image { width:151px; text-align:left; padding:0; border:1px solid color-mix(in srgb,var(--line) 60%,transparent); border-radius:9px; overflow:hidden; background:var(--bg); }
    .attachment-image img { display:block; width:100%; height:80px; object-fit:cover; }
    .attachment-image span { display:block; padding:4px 8px; color:var(--muted); font-size:9px; }
    .assistant-head { display:flex; align-items:center; gap:8px; font-size:11px; margin-bottom:12px; }
    .assistant-avatar { width:22px; height:22px; display:flex; align-items:center; justify-content:center; background:var(--surface); border-radius:6px; }
    .assistant-avatar img { width:18px; height:18px; object-fit:contain; }
    .assistant-head strong { font-weight:600; }
    .assistant-head .model { color:var(--quiet); font-size:10px; }
    .assistant-body { font-size:14px; line-height:1.85; word-break:keep-all; overflow-wrap:anywhere; }
    .assistant-body p + p { margin-top:12px; }
    .assistant-body h2 { font-size:23px; letter-spacing:-.7px; font-weight:600; margin:0 0 12px; line-height:1.5; }
    .assistant-body ul { padding-left:20px; margin:12px 0 15px; }
    .assistant-body li { padding:2px 0; }
    .assistant-body strong { font-weight:650; }
    .assistant-body code { font:12px/1.7 Consolas,monospace; background:var(--surface); padding:2px 5px; border-radius:4px; }
    .path-link { display:inline-flex; align-items:center; gap:5px; vertical-align:baseline; max-width:100%; padding:1px 0; text-align:left; color:var(--accent); text-decoration:underline; text-underline-offset:3px; font-size:inherit; overflow-wrap:anywhere; }
    .path-link .icon { width:14px; height:14px; }
    .work-log { margin:0 0 13px; font-size:11px; color:var(--muted); }
    .work-log summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:7px; width:fit-content; }
    .work-log summary::-webkit-details-marker { display:none; }
    .work-log summary .chevron { width:12px; transform:rotate(-90deg); color:var(--quiet); }
    .work-log[open] summary .chevron { transform:none; }
    .work-log summary .done { color:var(--green); width:14px; }
    .work-log summary .elapsed { color:var(--quiet); margin-left:2px; }
    .work-items { margin:9px 0 6px 5px; padding:0 0 0 17px; border-left:1px solid var(--line); display:grid; gap:8px; color:var(--quiet); }
    .work-item { display:flex; align-items:flex-start; gap:8px; }
    .work-item .icon { width:14px; height:14px; margin-top:3px; }
    .work-item p { font-size:11px; }
    .work-item strong { font-weight:500; color:var(--muted); }
    .artifact-card { width:100%; display:flex; align-items:center; gap:13px; padding:12px 14px; margin:17px 0 13px; border:1px solid var(--line); border-radius:11px; text-align:left; }
    .artifact-card:hover { background:var(--surface); border-color:var(--quiet); }
    .artifact-cover { width:52px; height:48px; border:1px solid var(--line); border-radius:7px; background:var(--surface); padding:8px; display:flex; gap:4px; flex-shrink:0; }
    .artifact-cover::before { content:""; width:9px; background:var(--selected); border-radius:2px; }
    .artifact-cover::after { content:""; flex:1; background:linear-gradient(var(--muted) 0 2px,transparent 2px 9px,var(--quiet) 9px 11px,transparent 11px 18px,var(--line) 18px 20px,transparent 20px); opacity:.7; }
    .artifact-card strong { display:block; font-size:12px; font-weight:600; }
    .artifact-card small { display:block; margin-top:2px; color:var(--quiet); font-size:10px; }
    .artifact-card .icon { margin-left:auto; color:var(--quiet); width:16px; }
    .change-card { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:15px 0 13px; font-size:11px; }
    .change-head { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--surface); border-bottom:1px solid var(--line); }
    .change-head strong { font-weight:600; }
    .change-head button { font-size:10px; padding:3px 8px; border:1px solid var(--line); border-radius:5px; }
    .change-row { width:100%; text-align:left; display:flex; align-items:center; gap:10px; padding:7px 12px; color:var(--muted); }
    .change-row:hover { background:var(--hover); }
    .change-row .numbers { margin-left:auto; font:10px Consolas,monospace; white-space:nowrap; }
    .added { color:var(--green); }
    .removed { color:var(--amber); }
    .assistant-actions { margin-top:9px; }
    .assistant-actions .answer-time { font-size:10px; padding-left:7px; color:var(--quiet); opacity:0; }
    .turn.assistant:hover .answer-time { opacity:1; }
    .code-block { margin:15px 0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface); }
    .code-head { display:flex; align-items:center; padding:7px 12px; background:var(--raised); gap:8px; font-size:10px; color:var(--muted); }
    .code-head button { margin-left:auto; display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); }
    .code-block pre { padding:14px; margin:0; overflow:auto; font:12px/1.8 Consolas,monospace; }
    .code-block pre code { padding:0; background:none; font:inherit; }
    .inline-photo { max-width:390px; margin:15px 0; }
    .inline-photo button { width:100%; padding:0; border:1px solid var(--line); border-radius:11px; overflow:hidden; display:block; }
    .inline-photo img { width:100%; display:block; }
    .inline-photo figcaption { margin-top:6px; font-size:10px; color:var(--quiet); }
    .quote-in-turn { border-left:2px solid var(--accent); padding-left:10px; margin-bottom:8px; font-size:11px; opacity:.7; }
    .question-card { border:1px solid color-mix(in srgb,var(--amber) 40%,var(--line)); background:var(--surface); border-radius:12px; padding:16px; margin:13px 0; }
    .question-card .question-title { font-size:13px; font-weight:600; }
    .question-card .question-title .icon { color:var(--amber); vertical-align:middle; margin-right:5px; width:16px; }
    .question-card p { margin-top:5px; font-size:12px; color:var(--muted); }
    .question-options { display:grid; gap:6px; margin:12px 0; }
    .question-options label { display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:12px; cursor:pointer; }
    .question-options label:has(input:checked) { border-color:var(--accent); background:var(--selected); }
    .question-options input { accent-color:var(--accent); }
    .small-primary { padding:7px 12px; background:var(--primary); color:var(--primary-text); border-radius:7px; font-size:11px; font-weight:600; }
    .jump-bottom { position:absolute; bottom:190px; left:50%; transform:translateX(-50%); width:33px; height:33px; border:1px solid var(--line); border-radius:50%; background:var(--surface); box-shadow:0 3px 14px #0002; z-index:2; }
    .composer-wrap { width:100%; flex-shrink:0; padding:4px 34px 12px; background:var(--bg); }
    .composer-column { max-width:var(--column); margin:auto; }
    .context-row { display:flex; align-items:center; gap:12px; height:26px; padding:0 4px; font-size:10px; color:var(--quiet); }
    .context-row button { display:flex; align-items:center; gap:5px; padding:0; color:var(--muted); font-size:10px; }
    .context-row .icon { width:12px; height:12px; }
    .context-row .connection { margin-left:auto; display:flex; gap:5px; align-items:center; }
    .work-status { display:flex; align-items:center; gap:9px; padding:9px 12px; margin:0 0 8px; font-size:11px; border:1px solid var(--line); border-radius:9px; background:var(--surface); }
    .work-status .status-copy { flex:1; min-width:0; }
    .work-status strong { font-weight:500; }
    .work-status small { font-size:10px; color:var(--quiet); margin-left:8px; }
    .work-status button { font-size:10px; padding:3px 8px; color:var(--muted); border:1px solid var(--line); border-radius:5px; }
    .spinner { width:12px; height:12px; border:1.5px solid var(--line); border-top-color:var(--green); border-radius:50%; animation:spin 1s linear infinite; }
    .work-status.waiting .spinner { animation:none; border:0; background:var(--amber); width:6px; height:6px; }
    .composer { border:1px solid var(--line); background:var(--surface); border-radius:15px; box-shadow:0 4px 20px #0001; padding:12px 14px 10px; transition:border-color .2s; }
    .composer:focus-within { border-color:var(--quiet); }
    .composer textarea { display:block; width:100%; height:58px; min-height:58px; max-height:180px; resize:none; background:none; border:0; outline:none; padding:0; font-size:13px; line-height:1.8; }
    .composer textarea:focus-visible { outline:0; }
    .composer textarea::placeholder { color:var(--quiet); }
    .composer-bottom { display:flex; align-items:center; gap:8px; margin-top:3px; }
    .composer-bottom .icon-button { width:27px; height:27px; }
    .provider-button { display:flex; align-items:center; gap:5px; padding:3px 5px; font-size:10px; color:var(--muted); border-radius:5px; }
    .provider-button:hover { background:var(--hover); }
    .provider-button .icon { width:11px; height:11px; }
    .send-button { display:flex; justify-content:center; align-items:center; width:31px; height:31px; border-radius:9px; background:var(--primary); color:var(--primary-text); }
    .send-button .icon { width:17px; height:17px; stroke-width:2; }

      if(action==='sample-image'||action==='sample-zip') { if(draftFiles.length>=4) {toast('파일은 최대 4개까지 첨부할 수 있어요.');return;} draftFiles.push(action==='sample-image'?images.after:{name:'layout-assets.zip'}); closeModal(); renderDraft(); saveDraft(); $('#message-input').focus(); }
      if(action==='remove-file') { draftFiles.splice(Number(button.dataset.index),1); renderDraft(); saveDraft(); }
      if(action==='image') openImage(button.dataset.image?images[button.dataset.image]:{url:button.dataset.src,name:button.dataset.name});
      if(action==='close-viewer') closeViewer();
      if(action==='fit') fitImage();
      if(action==='zoom-in') zoomImage(1.25);
      if(action==='zoom-out') zoomImage(.8);
      if(action==='copy-image') await copyImage();
      if(action==='download-image') { const link=document.createElement('a'); link.href=$('#viewer-image').src; link.download=$('#viewer-name').textContent; link.click(); }
    }
    document.addEventListener('click',event=>{
      const button=event.target.closest('button'); if(!button||button.disabled) return;
      if(button.dataset.chat) selectChat(button.dataset.chat);
      if(button.dataset.searchChat||button.dataset.notifyChat) { const id=button.dataset.searchChat||button.dataset.notifyChat;if(!$('#modal-overlay').hidden)closeModal();clearSidebarSearch();selectChat(id); }
      if(button.dataset.searchProject) { if(!$('#modal-overlay').hidden)closeModal(); selectProject(button.dataset.searchProject); }
      if(button.dataset.project) { const expanded=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',!expanded);$(`[data-children="${button.dataset.project}"]`).hidden=expanded;projectScope=button.dataset.project;$('#recent-title').textContent=button.querySelector('span').textContent+' · 최근 대화';applyFilter(); }
      if(button.dataset.filter) { filter=button.dataset.filter;$$('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b===button));applyFilter(); }
      if(button.dataset.view) { currentView=button.dataset.view;$$('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b===button));renderThread(); }
      if(button.dataset.previewTab) showPreview(currentPreview,button.dataset.previewTab);
      if(button.dataset.action) doAction(button.dataset.action,button).catch(error=>toast('동작을 완료하지 못했습니다: '+error.message));
    });
    $('#composer-form').addEventListener('submit',sendMessage);
    $('#message-input').addEventListener('input',()=>{updateSend();saveDraft();});
    $('#message-input').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('#composer-form').requestSubmit();}});
    $('#chat-scroll').addEventListener('scroll',updateJump);
    $('#modal-overlay').addEventListener('click',event=>{if(event.target===$('#modal-overlay')) closeModal();});
    document.addEventListener('input',event=>{if(event.target.id==='quick-search') renderSearch(event.target.value);if(event.target.id==='sidebar-search')renderSidebarSearch(event.target.value);});
    $('.sidebar').addEventListener('keydown',event=>{
      if(!sidebarQuery||!$('#modal-overlay').hidden||!$('#viewer').hidden)return;
      if(event.target!==$('#sidebar-search')&&!$('#sidebar-search-results').contains(event.target))return;
      if(event.key==='Escape'){event.preventDefault();event.stopPropagation();clearSidebarSearch(true);return;}
      if(!['ArrowDown','ArrowUp','Enter'].includes(event.key)||event.isComposing)return;
      const results=$$('#sidebar-search-results .search-result');if(!results.length)return;
      const index=results.indexOf(document.activeElement);event.preventDefault();
      if(event.key==='Enter')(index>=0?results[index]:results[0]).click();
      else results[index<0?(event.key==='ArrowDown'?0:results.length-1):(index+(event.key==='ArrowDown'?1:-1)+results.length)%results.length].focus();
    });
    document.addEventListener('change',event=>{
      if(event.target.id==='theme-setting') document.documentElement.dataset.theme=event.target.value;
      if(event.target.id==='width-setting') document.documentElement.style.setProperty('--column',event.target.value);
      if(event.target.id==='motion-setting') document.documentElement.dataset.reduceMotion=String(event.target.checked);
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape') {if(!$('#viewer').hidden) closeViewer();else if(!$('#modal-overlay').hidden) closeModal();else $('#app').classList.remove('mobile-sidebar-open');}
      if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k') {event.preventDefault();if($('#viewer').hidden) openSearch();}
      if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='t'&&$('#modal-overlay').hidden&&$('#viewer').hidden) {event.preventDefault();newChat();}
      const dialog=!$('#viewer').hidden?$('#viewer'):!$('#modal-overlay').hidden?$('#modal'):null;
      if(dialog&&event.key==='Tab') {const controls=$$('button,input,textarea,select',dialog).filter(c=>!c.disabled&&c.getClientRects().length);if(!controls.length)return;const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
      if(!$('#modal-overlay').hidden&&$('#quick-search')&&['ArrowDown','ArrowUp','Enter'].includes(event.key)&&!event.isComposing) {const results=$$('#search-results .search-result');if(!results.length)return;const index=results.indexOf(document.activeElement);if(event.key==='Enter'){event.preventDefault();(index>=0?results[index]:results[0]).click();}else {event.preventDefault();results[index<0?(event.key==='ArrowDown'?0:results.length-1):(index+(event.key==='ArrowDown'?1:-1)+results.length)%results.length].focus();}}
    });
    $('#file-input').addEventListener('change',event=>{
      for(const file of event.target.files) {
        if(draftFiles.length>=4) {toast('파일은 최대 4개까지 첨부할 수 있어요.');break;}
        const image=/\.(png|jpe?g|webp|gif)$/i.test(file.name),zip=/\.zip$/i.test(file.name),limit=zip?32*1024*1024:8*1024*1024;
        if(file.size>limit) {toast(`${file.name}: ${zip?'32':'8'}MiB 이하 파일을 선택해 주세요.`);continue;}
        draftFiles.push({name:file.name,url:image?URL.createObjectURL(file):undefined});
      }
      event.target.value='';renderDraft();saveDraft();
    });
    $('#viewer-stage').addEventListener('wheel',event=>{event.preventDefault();const rect=event.currentTarget.getBoundingClientRect();zoomImage(event.deltaY<0?1.12:1/1.12,event.clientX-rect.left-rect.width/2,event.clientY-rect.top-rect.height/2);},{passive:false});
    $('#viewer-stage').addEventListener('pointerdown',event=>{if(event.button!==0)return;dragStart={x:event.clientX,y:event.clientY,ox:viewerX,oy:viewerY};event.currentTarget.setPointerCapture(event.pointerId);event.currentTarget.classList.add('dragging');});
    $('#viewer-stage').addEventListener('pointermove',event=>{if(!dragStart)return;viewerX=dragStart.ox+event.clientX-dragStart.x;viewerY=dragStart.oy+event.clientY-dragStart.y;updateImageTransform();});
    const endDrag=()=>{dragStart=null;$('#viewer-stage').classList.remove('dragging');};
    $('#viewer-stage').addEventListener('pointerup',endDrag);$('#viewer-stage').addEventListener('pointercancel',endDrag);$('#viewer-stage').addEventListener('dblclick',fitImage);
    window.addEventListener('resize',()=>{if(!$('#viewer').hidden)fitImage();updateJump();});
    Object.entries(chats).forEach(([id,chat])=>chat.state=id==='review'?'waiting':['files','shader','assets'].includes(id)?'sleeping':'done');
    $$('.app-logo').forEach(img=>img.src=LOGO);
    selectChat('ux');
  </script>
</body>
</html>
