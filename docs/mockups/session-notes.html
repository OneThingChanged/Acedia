<!doctype html>
<html lang="ko" style="color-scheme:dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acedia · 세션 메모 초안</title><style>body{margin:0;padding:16px;background:light-dark(#e9edf2,#090d12)}@media(max-width:480px){body{padding:0}}</style></head><body>
<div id="acedia-session-notes" lang="ko" role="region" aria-label="Acedia 세션 메모 초안">
  <style>
    #acedia-session-notes { --an-bg:light-dark(#fafbfc,#0c1117); --an-side:light-dark(#f0f3f7,#111820); --an-panel:light-dark(#fff,#151d26); --an-raised:light-dark(#e8edf4,#202c3a); --an-hover:light-dark(#e4eaf1,#1c2733); --an-line:light-dark(#dbe1e8,#29333f); --an-text:light-dark(#202d3b,#e2e8ef); --an-muted:light-dark(#526475,#9aaaba); --an-faint:light-dark(#697987,#7c8d9d); --an-blue:light-dark(#2869bb,#75aff8); --an-selected:light-dark(#deebfb,#20334b); --an-amber:light-dark(#986409,#ecc47a); --an-note:light-dark(#fffcf5,#191c21); --an-soft:light-dark(#f6ecd7,#312c22); --an-green:light-dark(#32784e,#8dcaa3); font:13px/1.65 'Segoe UI','Malgun Gothic',sans-serif; color:var(--an-text); color-scheme:inherit; width:100%; }
    #acedia-session-notes * { box-sizing:border-box; }
    #acedia-session-notes button, #acedia-session-notes input, #acedia-session-notes textarea { font:inherit; color:inherit; }
    #acedia-session-notes button { border:0; background:none; cursor:pointer; }
    #acedia-session-notes button:disabled { opacity:.4; cursor:default; }
    #acedia-session-notes button:focus-visible, #acedia-session-notes input:focus-visible, #acedia-session-notes textarea:focus-visible { outline:2px solid var(--an-blue); outline-offset:3px; }
    #acedia-session-notes [hidden] { display:none !important; }
    #acedia-session-notes h1, #acedia-session-notes h2, #acedia-session-notes p { margin:0; }
    #acedia-session-notes .an-window { background:var(--an-bg); border:1px solid var(--an-line); border-radius:10px; overflow:clip; }
    #acedia-session-notes .an-chrome { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:39px; padding:5px 16px; background:var(--an-side); border-bottom:1px solid var(--an-line); }
    #acedia-session-notes .an-chrome-label { color:var(--an-faint); font-size:11px; letter-spacing:.04em; }
    #acedia-session-notes .an-quick { display:flex; align-items:center; gap:8px; width:280px; padding:3px 10px; border:1px solid var(--an-line); border-radius:6px; color:var(--an-muted); font-size:11px; }
    #acedia-session-notes .an-quick kbd { margin-left:auto; font:10px 'Segoe UI',sans-serif; border:1px solid var(--an-line); border-radius:3px; padding:0 4px; }
    #acedia-session-notes .an-layout { display:grid; grid-template-columns:208px minmax(0,1fr); min-height:696px; }
    #acedia-session-notes .an-sidebar { background:var(--an-side); border-right:1px solid var(--an-line); padding:20px 11px 12px; display:flex; flex-direction:column; gap:20px; min-width:0; }
    #acedia-session-notes .an-brand { display:flex; align-items:center; gap:8px; padding:0 9px; font-size:18px; font-weight:600; letter-spacing:-.5px; }
    #acedia-session-notes .an-brand-mark { width:27px; height:27px; object-fit:contain; }
    #acedia-session-notes .an-brand .an-icon { margin-left:auto; color:var(--an-muted); }
    #acedia-session-notes .an-search { display:flex; align-items:center; gap:7px; padding:7px 9px; border:1px solid var(--an-line); border-radius:7px; background:var(--an-bg); color:var(--an-muted); }
    #acedia-session-notes .an-search input { width:100%; min-width:0; background:none; border:0; outline:none; font-size:11px; }
    #acedia-session-notes .an-nav { display:flex; align-items:center; gap:8px; margin-top:9px; border-radius:6px; padding:7px 9px; background:var(--an-hover); font-size:12px; }
    #acedia-session-notes .an-section-label { margin:0 8px 8px; font-size:11px; color:var(--an-faint); }
    #acedia-session-notes .an-project { display:flex; align-items:center; gap:7px; padding:5px 8px; font-size:12px; }
    #acedia-session-notes .an-project small { margin-left:auto; color:var(--an-faint); }
    #acedia-session-notes .an-tree { padding-left:10px; margin:3px 0 9px 13px; border-left:1px solid var(--an-line); }
    #acedia-session-notes .an-session { position:relative; display:flex; align-items:center; gap:5px; border-radius:7px; min-width:0; margin:2px 0; }
    #acedia-session-notes .an-session:hover, #acedia-session-notes .an-session:focus-within { background:var(--an-hover); }
    #acedia-session-notes .an-session[data-selected=true] { background:var(--an-selected); box-shadow:inset 2px 0 var(--an-blue); }
    #acedia-session-notes .an-session-main { display:flex; align-items:center; gap:8px; padding:8px 9px; min-width:0; flex:1; text-align:left; }
    #acedia-session-notes .an-session-main span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #acedia-session-notes .an-dot { width:5px; height:5px; background:var(--an-green); border-radius:50%; flex-shrink:0; }
    #acedia-session-notes .an-dot.offline { background:var(--an-faint); }
    #acedia-session-notes .an-row-action { display:none; padding:3px 7px; margin-right:4px; color:var(--an-muted); }
    #acedia-session-notes .an-session:hover .an-row-action, #acedia-session-notes .an-session:focus-within .an-row-action { display:block; }
    #acedia-session-notes .an-sidebar-hint { margin-top:auto; padding:12px 8px 0; color:var(--an-faint); font-size:11px; border-top:1px solid var(--an-line); }
    #acedia-session-notes .an-workspace { min-width:0; display:flex; flex-direction:column; }
    #acedia-session-notes .an-tabs { display:flex; gap:3px; align-items:stretch; min-height:37px; border-bottom:1px solid var(--an-line); padding:0 10px; }
    #acedia-session-notes .an-tab { display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:12px; border-top:2px solid var(--an-blue); }
    #acedia-session-notes .an-tabs .an-prototype { margin:auto 3px auto auto; color:var(--an-faint); font-size:11px; }
    #acedia-session-notes .an-split { margin:4px; padding:2px 8px; font-size:11px; color:var(--an-muted); border-radius:5px; }
    #acedia-session-notes .an-split[aria-pressed=true] { color:var(--an-blue); background:var(--an-selected); }
    #acedia-session-notes .an-panes { display:grid; flex:1; min-width:0; }
    #acedia-session-notes[data-split=true] .an-panes { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    #acedia-session-notes .an-pane { min-width:0; display:flex; flex-direction:column; container-type:inline-size; }
    #acedia-session-notes .an-pane + .an-pane { border-left:1px solid var(--an-line); }
    #acedia-session-notes .an-toolbar { min-height:47px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 17px; border-bottom:1px solid var(--an-line); }
    #acedia-session-notes .an-session-identity { min-width:0; display:flex; flex-wrap:wrap; gap:0 8px; align-items:center; font-size:12px; }
    #acedia-session-notes .an-session-identity span { color:var(--an-faint); font-size:11px; }
    #acedia-session-notes .an-tools { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    #acedia-session-notes .an-tool { display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border:1px solid var(--an-line); border-radius:6px; color:var(--an-muted); font-size:11px; }
    #acedia-session-notes .an-tool:hover { background:var(--an-hover); }
    #acedia-session-notes .an-tool[aria-pressed=true] { color:var(--an-amber); background:var(--an-soft); border-color:color-mix(in srgb,var(--an-amber) 35%,var(--an-line)); }
    #acedia-session-notes .an-note-dot { width:4px; height:4px; border-radius:50%; background:var(--an-amber); }
    #acedia-session-notes .an-pane-body { display:grid; grid-template-columns:minmax(0,1fr); flex:1; min-width:0; }
    #acedia-session-notes .an-pane-body[data-notes-open=true] { grid-template-columns:minmax(0,1fr) var(--an-note-width,300px); }
    #acedia-session-notes .an-chat { min-width:0; display:flex; flex-direction:column; gap:24px; padding:27px clamp(18px,4cqw,42px) 17px; }
    #acedia-session-notes .an-date { text-align:center; font-size:11px; color:var(--an-faint); }
    #acedia-session-notes .an-user { align-self:flex-end; background:var(--an-raised); border-radius:17px 17px 4px 17px; max-width:90%; padding:13px 16px; font-size:13px; white-space:pre-wrap; }
    #acedia-session-notes .an-assistant { font-size:13px; }
    #acedia-session-notes .an-assistant-label { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--an-muted); margin-bottom:15px; }
    #acedia-session-notes .an-agent-mark { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:7px; background:var(--an-selected); color:var(--an-blue); font-size:15px; }
    #acedia-session-notes .an-assistant p + p { margin-top:13px; }
    #acedia-session-notes .an-assistant ul { padding-left:18px; margin:13px 0; }
    #acedia-session-notes .an-assistant li { margin:5px 0; }
    #acedia-session-notes .an-complete { margin-top:15px; font-size:11px; color:var(--an-faint); }
    #acedia-session-notes .an-compose { margin-top:auto; padding-top:15px; }
    #acedia-session-notes .an-context { color:var(--an-faint); font-size:11px; margin:0 4px 7px; }
    #acedia-session-notes .an-composer { background:var(--an-panel); border:1px solid var(--an-line); border-radius:13px; padding:12px 14px; }
    #acedia-session-notes .an-composer textarea { display:block; width:100%; resize:none; background:none; border:0; min-height:52px; outline:none; font-size:12px; }
    #acedia-session-notes .an-composer-foot { display:flex; align-items:center; gap:12px; color:var(--an-muted); font-size:11px; }
    #acedia-session-notes .an-send { margin-left:auto; padding:2px 9px; border-radius:6px; background:var(--an-raised); color:var(--an-faint); }
    #acedia-session-notes .an-terminal { flex:1; min-width:0; padding:25px 20px; font:12px/1.9 Consolas,monospace; overflow-wrap:anywhere; }
    #acedia-session-notes .an-terminal p { margin-bottom:16px; }
    #acedia-session-notes .an-terminal .an-prompt { color:var(--an-blue); }
    #acedia-session-notes .an-terminal .an-answer { color:var(--an-green); }
    #acedia-session-notes .an-offline { margin:auto; text-align:center; padding:65px 18px; color:var(--an-muted); }
    #acedia-session-notes .an-offline strong { display:block; color:var(--an-text); margin-bottom:8px; }
    #acedia-session-notes .an-notes { display:flex; flex-direction:column; min-width:0; padding:18px 19px 14px; background:var(--an-note); border-left:1px solid var(--an-line); }
    #acedia-session-notes .an-note-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    #acedia-session-notes .an-note-heading h2 { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; }
    #acedia-session-notes .an-note-heading h2 .an-icon { color:var(--an-amber); }
    #acedia-session-notes .an-icon-button { width:27px; height:27px; display:inline-grid; place-items:center; color:var(--an-muted); border-radius:5px; }
    #acedia-session-notes .an-icon-button:hover { background:var(--an-hover); }
    #acedia-session-notes .an-note-actions { display:flex; gap:3px; }
    #acedia-session-notes .an-owner { margin-top:17px; display:flex; align-items:center; gap:7px; color:var(--an-muted); font-size:11px; }
    #acedia-session-notes .an-owner strong { color:var(--an-text); font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #acedia-session-notes .an-owner .an-owner-status { margin-left:auto; font-size:10px; color:var(--an-faint); white-space:nowrap; }
    #acedia-session-notes .an-note-editor { width:100%; flex:1; min-height:330px; resize:none; border:0; border-top:1px solid var(--an-line); border-radius:0; background:transparent; margin-top:13px; padding:17px 0; color:var(--an-text); line-height:1.95; outline-offset:5px; }
    #acedia-session-notes .an-note-editor::placeholder { color:var(--an-faint); }
    #acedia-session-notes .an-note-footer { border-top:1px solid var(--an-line); padding-top:11px; font-size:11px; }
    #acedia-session-notes .an-save { display:flex; align-items:center; gap:6px; color:var(--an-muted); min-height:21px; }
    #acedia-session-notes .an-save .an-icon { color:var(--an-green); }
    #acedia-session-notes .an-personal { color:var(--an-faint); display:flex; align-items:center; gap:5px; margin-top:6px; }
    #acedia-session-notes .an-icon { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; flex-shrink:0; }
    #acedia-session-notes .an-icon svg { width:16px; height:16px; stroke-width:1.6; }
    #acedia-session-notes .an-icon:has(svg) .an-fallback { display:none; }
    #acedia-session-notes .an-menu { position:absolute; width:185px; padding:5px; background:var(--an-panel); border:1px solid var(--an-line); border-radius:8px; box-shadow:0 8px 30px light-dark(#26374c25,#0005); z-index:8; }
    #acedia-session-notes .an-menu button { display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; text-align:left; border-radius:4px; font-size:12px; }
    #acedia-session-notes .an-menu button:hover { background:var(--an-hover); }
    #acedia-session-notes .an-menu small { display:block; padding:3px 10px; font-size:10px; color:var(--an-faint); }
    #acedia-session-notes .an-statusbar { min-height:27px; padding:4px 12px; display:flex; gap:8px; align-items:center; border-top:1px solid var(--an-line); font-size:10px; background:var(--an-side); color:var(--an-muted); }
    #acedia-session-notes .an-statusbar span:last-child { margin-left:auto; color:var(--an-faint); }
    #acedia-session-notes .an-no-results { padding:10px; color:var(--an-muted); font-size:12px; }
    @container (max-width:690px) {
      #acedia-session-notes .an-pane-body[data-notes-open=true] { grid-template-columns:minmax(0,1fr); }
      #acedia-session-notes .an-notes { border-left:0; border-top:1px solid var(--an-line); order:-1; }
      #acedia-session-notes .an-note-editor { min-height:230px; max-height:330px; }
      #acedia-session-notes .an-chat { gap:20px; }
    }
    @media(max-width:760px) {
      #acedia-session-notes .an-layout { grid-template-columns:164px minmax(0,1fr); }
      #acedia-session-notes .an-sidebar { padding:16px 7px; }
      #acedia-session-notes .an-brand { font-size:16px; }
      #acedia-session-notes .an-toolbar { padding:9px 12px; flex-wrap:wrap; }
      #acedia-session-notes[data-split=true] .an-panes { grid-template-columns:1fr; }
      #acedia-session-notes .an-pane + .an-pane { border-left:0; border-top:1px solid var(--an-line); }
      #acedia-session-notes .an-chrome-label { display:none; }
      #acedia-session-notes .an-quick { width:auto; flex:1; }
    }
    @media(max-width:480px) {
      #acedia-session-notes .an-layout { grid-template-columns:1fr; }
      #acedia-session-notes .an-sidebar { border-right:0; border-bottom:1px solid var(--an-line); gap:10px; padding:12px; }
      #acedia-session-notes .an-brand { font-size:16px; }
      #acedia-session-notes .an-sidebar .an-projects, #acedia-session-notes .an-sidebar-hint, #acedia-session-notes .an-nav { display:none; }
      #acedia-session-notes .an-session-list { display:flex; flex-wrap:wrap; gap:3px; }
      #acedia-session-notes .an-session { max-width:100%; }
      #acedia-session-notes .an-session-main { padding:6px 9px; font-size:12px; }
      #acedia-session-notes .an-row-action { display:block; margin:0; padding:3px; }
      #acedia-session-notes .an-section-label { margin-bottom:3px; }
      #acedia-session-notes .an-search { margin-top:2px; }
      #acedia-session-notes .an-tabs { padding:0 4px; gap:0; }
      #acedia-session-notes .an-tab { padding:7px; }
      #acedia-session-notes .an-prototype { display:none; }
      #acedia-session-notes .an-notes { padding:15px 19px; }
      #acedia-session-notes .an-note-editor, #acedia-session-notes .an-composer textarea, #acedia-session-notes .an-search input { font-size:16px; }
      #acedia-session-notes .an-statusbar span:last-child { display:none; }
    }
    @media(pointer:coarse) { #acedia-session-notes .an-tool, #acedia-session-notes .an-icon-button, #acedia-session-notes .an-row-action { min-height:44px; min-width:44px; } #acedia-session-notes .an-session-main { min-height:44px; } }
  </style>

  <script>
    (() => {
      const root = document.getElementById('acedia-session-notes');
      const sessions = {
        rnd: { name:'RnDHub', project:'RnDHub', online:true, initial:'다음에 이어서 할 일\n\n• ShaderNoiseBall 결과 먼저 확인\n• 세 작업이 끝나면 비교 스크린샷 모으기\n• 주말에 전체 진행 상황 정리\n\n기억할 것\n\n지금은 실험 단계. 원본 프로젝트는 건드리지 말기.\n좋았던 결과는 ref 폴더에 따로 모아 두자.' },
        level: { name:'ShaderLevelUp', project:'RnDHub', online:true, initial:'카메라 가까이에서도 경계가 자연스러운지 확인.\n\n밝은 배경, 어두운 배경 두 가지로 비교하기.' },
        noise: { name:'ShaderNoiseBall', project:'RnDHub', online:true, initial:'속도 0.4 근처가 가장 자연스러웠음.\n\n다음에는 노이즈 크기만 바꿔서 비교하기.' },
        skin: { name:'ShaderSkinner', project:'RnDHub', online:true, initial:'' },
        witch: { name:'ProjectWitch', project:'ProjectWitch', online:true, initial:'멀티플레이 테스트할 때 노트북도 함께 켜기.' },
        nogari: { name:'Nogari', project:'Nogari', online:false, initial:'시간 날 때 UI 아이디어만 정리.\n급한 작업은 아님.' }
      };
      const storageKey = 'acedia.mockup.session-notes.v1';
      const state = { split:false, notes:{}, active:'rnd', owner:'rnd', open:true, mode:'chat', sideOpen:false, sideMode:'chat' };
      for (const [id,s] of Object.entries(sessions)) state.notes[id] = s.initial;
      let storageAvailable = false;
      try { const saved = JSON.parse(localStorage.getItem(storageKey) || 'null'); if (saved && typeof saved.notes === 'object') for(const id of Object.keys(sessions)) if(typeof saved.notes[id] === 'string') state.notes[id] = saved.notes[id]; storageAvailable = true; } catch {}
      const hostState = globalThis.openai?.widgetState?.privateContent;
      if(hostState?.demo === 'acedia-session-notes' && hostState.notes) for(const id of Object.keys(sessions)) if(typeof hostState.notes[id] === 'string') state.notes[id] = hostState.notes[id];
      const paneTemplate = root.querySelector('#an-pane-template');
      for(const pane of root.querySelectorAll('.an-pane')) pane.append(paneTemplate.content.cloneNode(true));
      const main = root.querySelector('[data-pane="main"]');
      const side = root.querySelector('[data-pane="side"]');
      const menu = root.querySelector('.an-menu');
      const saveTimers = new Map();
      let contextOwner = 'rnd';
      let copiedTimer;
      function icon(name,fallback) { return `<span class="an-icon"><i data-lucide="${name}" aria-hidden="true"></i><span class="an-fallback" aria-hidden="true">${fallback}</span></span>`; }
      function refreshIcons() { globalThis.lucide?.createIcons({root,attrs:{width:16,height:16}}); }
      function persist() {
        let saved = false;
        if(storageAvailable) try { localStorage.setItem(storageKey,JSON.stringify({notes:state.notes})); saved = true; } catch { storageAvailable = false; }
        const privateContent = {demo:'acedia-session-notes',notes:state.notes};
        if(globalThis.openai?.setWidgetState && new TextEncoder().encode(JSON.stringify(privateContent)).length < 14000) {
          Promise.resolve(globalThis.openai.setWidgetState({modelContent:null,privateContent})).catch(() => {});
          saved = true;
        }
        return saved;
      }
      function saveLabel(id,label) { for(const pane of [main,side]) if(pane.dataset.owner === id) pane.querySelector('[data-save-label]').textContent = label; }
      function flush(id) { if(saveTimers.has(id)) { clearTimeout(saveTimers.get(id)); saveTimers.delete(id); } const saved = persist(); const stamp = new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()); saveLabel(id,saved ? `${stamp} · 미리보기에 저장됨` : '이번 미리보기 동안 유지됨'); }
      function renderLists() {
        const filter = root.querySelector('#an-session-search').value.trim().toLowerCase();
        const row = id => { const s = sessions[id]; return `<div class="an-session" data-id="${id}" data-selected="${id===state.active}"><button type="button" class="an-session-main" data-action="select" data-id="${id}" aria-label="${s.name} 세션 선택"><span class="an-dot ${s.online?'':'offline'}"></span><span>${s.name}</span></button><button type="button" class="an-row-action" data-action="row-menu" data-id="${id}" aria-label="${s.name} 세션 메뉴">···</button></div>`; };
        root.querySelector('[data-tree-list]').innerHTML = ['rnd','level','noise','skin'].filter(id => !filter || `${sessions[id].name} ${sessions[id].project}`.toLowerCase().includes(filter)).map(row).join('');
        const ids = ['rnd','witch','nogari'].filter(id => !filter || `${sessions[id].name} ${sessions[id].project}`.toLowerCase().includes(filter));
        if(filter) for(const id of ['level','noise','skin']) if(`${sessions[id].name} ${sessions[id].project}`.toLowerCase().includes(filter)) ids.push(id);
        root.querySelector('[data-recent-list]').innerHTML = ids.map(row).join('');
        root.querySelector('.an-no-results').hidden = ids.length > 0;
      }
      function conversation(id,mode) {
        const s = sessions[id];
        if(!s.online) return `<div class="an-offline"><strong>${s.name}</strong><p>세션이 꺼져 있습니다.</p><p>메모는 언제든 작성할 수 있어요.</p></div>`;
        if(mode === 'terminal') return `<div class="an-terminal"><p class="an-prompt">› ${id==='rnd'?'세 작업의 진행 상황을 확인하고 정리해줘.':'작업 결과를 확인해줘.'}</p><p>프로젝트 문서와 현재 작업 상태를 확인했습니다.</p><p class="an-answer">✓ ${s.name} 작업 내용을 정리했습니다.</p><p>다음 작업은 결과를 비교한 뒤 이어갈 수 있습니다.</p><p class="an-prompt">› 다음 요청을 입력하세요</p></div>`;
        return `<div class="an-chat"><div class="an-date">오늘</div><div class="an-user">${id==='rnd'?'세 작업의 진행 상황을 확인하고\n다음에 할 일을 정리해줘.':`${s.name} 작업 결과를 정리해줘.`}</div><div class="an-assistant"><div class="an-assistant-label"><span class="an-agent-mark" aria-hidden="true">✧</span>Acedia · ${s.project}</div><p>${id==='rnd'?'세 작업의 현재 상태를 확인했습니다.':'작업 결과를 확인했습니다.'}</p><ul><li>구현 결과와 검증 기록을 모았습니다.</li><li>비교할 항목은 각 세션에 정리했습니다.</li><li>다음 작업은 결과 검토 후 이어갈 수 있습니다.</li></ul><p>확인하고 싶은 부분부터 이어가 주세요.</p><div class="an-complete">작업 완료 · 오후 3:42</div></div><div class="an-compose"><div class="an-context">${icon('folder','▱')} ${s.project} · 이 컴퓨터</div><div class="an-composer"><textarea aria-label="대화 입력 미리보기" placeholder="대화를 이어가세요…" rows="2"></textarea><div class="an-composer-foot"><span aria-hidden="true">＋</span><span>GPT-6.1-Sol ⌄</span><span class="an-send" aria-hidden="true">↑</span></div></div></div></div>`;
      }
      function renderPane(pane,id,owner,open,mode) {
        pane.dataset.session = id; pane.dataset.owner = owner;
        pane.querySelector('[data-session-name]').textContent = sessions[id].name;
        pane.querySelector('[data-session-runtime]').textContent = sessions[id].online ? 'GPT-6.1-Sol · xhigh' : '오프라인';
        pane.querySelector('[data-mode-label]').textContent = mode === 'chat' ? '터미널' : '채팅';
        pane.querySelector('[data-action="mode"]').setAttribute('aria-label',mode === 'chat' ? '터미널 모드로 전환' : '채팅 모드로 전환');
        const noteButton = pane.querySelector('[data-action="note"]');
        noteButton.setAttribute('aria-pressed',String(open)); noteButton.setAttribute('aria-expanded',String(open));
        noteButton.setAttribute('aria-label',`${sessions[id].name} 메모 ${open?'닫기':'열기'}`);
        noteButton.querySelector('.an-note-dot').hidden = !state.notes[id].trim();
        pane.querySelector('.an-pane-body').dataset.notesOpen = String(open);
        pane.querySelector('.an-notes').hidden = !open;
        pane.querySelector('[data-note-owner]').textContent = sessions[owner].name;
        pane.querySelector('[data-note-runtime]').textContent = sessions[owner].online ? '개인 메모' : '오프라인 · 개인 메모';
        pane.querySelector('.an-note-editor').value = state.notes[owner];
        pane.querySelector('.an-note-editor').setAttribute('aria-label',`${sessions[owner].name} 개인 세션 메모`);
        pane.querySelector('[data-save-label]').textContent = state.notes[owner] ? '자동 저장' : '입력하면 자동 저장됩니다';
        pane.querySelector('[data-action="copy"]').disabled = !state.notes[owner].trim();
        pane.querySelector('.an-conversation').innerHTML = conversation(id,mode);
      }
      function render() {
        root.dataset.split = String(state.split);
        root.querySelector('[data-action="split"]').setAttribute('aria-pressed',String(state.split));
        root.querySelector('[data-tab-name]').textContent = sessions[state.active].name;
        side.hidden = !state.split;
        renderLists(); renderPane(main,state.active,state.owner,state.open,state.mode); renderPane(side,'noise','noise',state.sideOpen,state.sideMode); refreshIcons();
      }
      function showNote(id) { state.owner = id; state.open = true; menu.hidden = true; render(); main.querySelector('.an-note-editor').focus(); }
      function openMenu(id,x,y) {
        contextOwner = id; menu.querySelector('[data-menu-owner]').textContent = sessions[id].name;
        menu.hidden = false; root.style.position = 'relative';
        const box = root.getBoundingClientRect();
        menu.style.left = `${Math.max(6,Math.min(x-box.left,box.width-193))}px`;
        menu.style.top = `${Math.max(6,Math.min(y-box.top,box.height-90))}px`;
        menu.querySelector('button').focus();
      }
      root.addEventListener('contextmenu',event => { const row = event.target.closest('.an-session'); if(!row) return; event.preventDefault(); openMenu(row.dataset.id,event.clientX,event.clientY); });
      root.addEventListener('click',async event => {
        const button = event.target.closest('button[data-action]');
        if(!button) { if(!event.target.closest('.an-menu')) menu.hidden = true; return; }
        const action = button.dataset.action; const pane = button.closest('.an-pane'); const isSide = pane === side;
        if(action !== 'row-menu') menu.hidden = true;
        if(action === 'row-menu') { const b = button.getBoundingClientRect(); openMenu(button.dataset.id,b.right,b.bottom); return; }
        if(action === 'context-note') { showNote(contextOwner); return; }
        if(action === 'select') { flush(state.owner); state.active = button.dataset.id; state.owner = state.active; render(); return; }
        if(action === 'split') { state.split = !state.split; render(); return; }
        if(action === 'mode') { if(isSide) state.sideMode = state.sideMode === 'chat' ? 'terminal' : 'chat'; else state.mode = state.mode === 'chat' ? 'terminal' : 'chat'; render(); return; }
        if(action === 'note' || action === 'close') {
          if(isSide) state.sideOpen = action === 'close' ? false : !state.sideOpen;
          else { state.open = action === 'close' ? false : !state.open; if(action === 'note') state.owner = state.active; }
          render(); if(action === 'close') pane.querySelector('[data-action="note"]').focus(); return;
        }
        if(action === 'copy') {
          const editor = pane.querySelector('.an-note-editor'); let copied = false;
          try { await navigator.clipboard.writeText(editor.value); copied = true; } catch { editor.focus(); editor.select(); try { copied = document.execCommand('copy'); } catch {} }
          const label = pane.querySelector('[data-save-label]'); label.textContent = copied ? '메모를 복사했습니다' : '텍스트를 선택해 복사해 주세요';
          clearTimeout(copiedTimer); const owner = pane.dataset.owner; copiedTimer = setTimeout(() => saveLabel(owner,'자동 저장'),1800);
        }
      });
      root.addEventListener('input',event => {
        if(event.target.id === 'an-session-search') { renderLists(); return; }
        if(!event.target.matches('.an-note-editor')) return;
        const pane = event.target.closest('.an-pane'); const id = pane.dataset.owner;
        state.notes[id] = event.target.value;
        for(const other of [main,side]) {
          if(other !== pane && other.dataset.owner === id) other.querySelector('.an-note-editor').value = state.notes[id];
          if(other.dataset.owner === id) other.querySelector('[data-action="copy"]').disabled = !state.notes[id].trim();
          if(other.dataset.session === id) other.querySelector('[data-action="note"] .an-note-dot').hidden = !state.notes[id].trim();
        }
        saveLabel(id,'저장 중…'); clearTimeout(saveTimers.get(id)); saveTimers.set(id,setTimeout(() => flush(id),500));
      });
      root.addEventListener('focusout',event => { if(event.target.matches('.an-note-editor')) flush(event.target.closest('.an-pane').dataset.owner); });
      root.addEventListener('keydown',event => { if(event.key === 'Escape') { if(!menu.hidden) menu.hidden = true; else if(event.target.closest('.an-notes')) { const pane=event.target.closest('.an-pane'); if(pane===side) state.sideOpen=false; else state.open=false; render(); pane.querySelector('[data-action="note"]').focus(); } } });
      addEventListener('pagehide',() => { for(const id of saveTimers.keys()) flush(id); });
      addEventListener('openai:set_globals',event => {
        const next = event.detail?.globals?.widgetState?.privateContent;
        if(next?.demo !== 'acedia-session-notes' || !next.notes || saveTimers.size || root.contains(document.activeElement)) return;
        for(const id of Object.keys(sessions)) if(typeof next.notes[id] === 'string') state.notes[id] = next.notes[id]; render();
      });
      render();
      if(globalThis.Tweak) { const design={width:300}; const tweak=new Tweak({container:root,onChange:() => root.style.setProperty('--an-note-width',`${design.width}px`)}); tweak.addSlider(design,'width',{label:'메모 패널 너비',min:260,max:360,step:10,unit:'px'}); }
    })();
  </script>
</div>

</body></html>
