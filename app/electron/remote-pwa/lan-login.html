<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="referrer" content="no-referrer" />
  <title>Acedia LAN</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/pwa/styles.css" />
  <script type="module" src="/pwa/lan-login.js"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand"><span class="brand-mark" aria-hidden="true">M</span><b>Acedia LAN</b></div>
    <h1>로컬 네트워크 연결</h1>
    <p class="login-copy" id="lanHelp">호스트 PC의 Acedia 설정에서 대시보드의 주소만으로 접속 허용을 켠 뒤 다시 확인하세요. 접속 링크를 복사해 이 브라우저에서 열 수도 있습니다.</p>
    <p class="login-copy" id="lanConnecting" role="status" hidden>대시보드 연결 중…</p>
    <p class="login-error" id="lanError" role="alert" hidden></p>
    <button class="small-button" id="lanRetry" type="button">접속 다시 확인</button>
  </main>
</body>
</html>
